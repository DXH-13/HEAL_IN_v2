<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/web/css/pregame.css">
</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">

    <div class="w-full max-w-3xl bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-center mb-6">Chọn Bộ Bài</h1>
        <div class="flex justify-between gap-4">
            <div class="w-1/2 border border-gray-300 rounded-lg p-4 cursor-pointer hover:shadow-md transition"
                id="deck1">
                <img src="/web/assets/images/products/doanvien/doanvien_1.png" alt="Deck 1"
                    class="w-full h-48 object-cover mb-4">
                <h2 class="text-lg font-semibold text-center">Bộ Bài Đoàn Viên</h2>
            </div>
            <div class="w-1/2 border border-gray-300 rounded-lg p-4 cursor-pointer hover:shadow-md transition"
                id="deck2">
                <img src="/web/assets/images/products/doanvien/doanvien_1.png" alt="Deck 2"
                    class="w-full h-48 object-cover mb-4">
                <h2 class="text-lg font-semibold text-center">Bộ Bài Tri Kỷ</h2>
            </div>
        </div>

        <div class="overlay" id="choiceOverlay">
            <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
                <h2 class="text-xl font-bold mb-4">Bạn muốn làm gì tiếp theo?</h2>
                <div class="flex justify-between">
                    <button id="startImmediately"
                        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Bắt đầu ngay</button>
                    <button id="addPlayers" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">Thêm
                        người chơi</button>
                </div>
            </div>
        </div>

        <div class="overlay" id="playerOverlay">
            <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md relative">
                <h2 class="text-xl font-bold mb-4">Thêm Người Chơi</h2>
                <div class="flex items-center gap-2 mb-4">
                    <input type="text" id="playerName" class="w-full border border-gray-300 rounded-lg p-2"
                        placeholder="Nhập tên người chơi">
                    <button id="addPlayer"
                        class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">Thêm</button>
                </div>
                <div class="overflow-y-auto max-h-40 mb-2" id="playerList">
                </div>
                <div class="mt-2">
                    <button id="startGame"
                        class="w-full bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Bắt Đầu</button>
                </div>
            </div>
        </div>


        <script src="/web/js/pregame.js"></script>

</body>

</html>
